schema_version: 1
milestone: ppo_lagrangian_on_policy_positive_stl_cost_sanity
status: fixed_sanity_configuration_not_main_training

ppo_lagrangian_sanity:
  algorithm: PPOLag
  environment_id: Stage1SafetyPointGoal1STLCost-v0
  seed: 20260811
  train_cfgs:
    device: cpu
    torch_threads: 2
    vector_env_nums: 2
    parallel: 1
    total_steps: 2000
  algo_cfgs:
    steps_per_epoch: 2000
    update_iters: 1
    batch_size: 256
    obs_normalize: false
    reward_normalize: false
    cost_normalize: false
  logger_cfgs:
    use_wandb: false
    use_tensorboard: false
    save_model_freq: 1
  model_cfgs:
    actor:
      hidden_sizes: [16, 16]
    critic:
      hidden_sizes: [16, 16]
  lagrange_cfgs:
    # Sanity-only semantic budget: 0.1 missed obligations per episode.
    # D31 later approved this value for the Stage I pilot only.
    cost_limit: 0.1
    lagrangian_multiplier_init: 0.001
    lambda_lr: 0.035
    lambda_optimizer: Adam
  env_cfgs:
    max_episode_steps: 1000

acceptance:
  require_positive_mean_stl_cost: true
  require_selected_cost_equals_stl_cost: true
  require_positive_trigger_count: true
  require_positive_terminal_event_count: true
  require_explicit_cost_limit: true
  require_rollout_episode_alignment: true

scope_note: >-
  This one-epoch run verifies that an STL event cost occurs inside data sampled
  by the PPOLag actor and reaches the learner update. It is not a behavioral
  comparison, a trained policy result, or a safety claim.
