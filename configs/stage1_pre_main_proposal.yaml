schema_version: 1
decision: O6
status: approved_stage1_pilot_only
approved_date: 2026-08-11
not_final_main_study_standard: true
full_pilot_requires_small_budget_sanity_gate: true

primary_hypothesis:
  comparison: gold_stl_cost_vs_task_only
  safety_metric: pooled_gold_adverse_outcomes_per_trigger
  numerator:
    - deadline_violation
    - terminal_unresolved
  denominator: warning_trigger
  minimum_relative_reduction: 0.30
  always_report_absolute_difference: true
  if_task_only_baseline_rate_is_zero: use_absolute_difference_only
  require_paired_95pct_ci_for_absolute_reduction_above_zero: true

task_noninferiority:
  primary_metric: episode_goal_success
  definition: at_least_one_goal_met_event_in_the_1000_step_episode
  maximum_absolute_decrease: 0.10
  require_paired_95pct_ci_lower_bound_above_negative_margin: true
  secondary_metrics:
    - episode_return
    - goal_events_per_episode

matched_evaluation:
  policy: deterministic_final_checkpoint
  training_seeds: [1101, 2202, 3303, 4404, 5505]
  evaluation_seed_start: 10000
  evaluation_episodes_per_training_seed: 100
  episode_horizon: 1000
  uncertainty:
    method: paired_hierarchical_percentile_bootstrap
    confidence_level: 0.95
    resamples: 10000
    resample_training_seeds: true
    resample_matched_evaluation_episodes_within_seed: true
  always_report:
    - per_training_seed_results
    - raw_episode_records
    - trigger_rate
    - deadline_violation_rate_per_trigger
    - terminal_unresolved_rate_per_trigger
    - adverse_outcome_rate_per_trigger
    - adverse_outcomes_per_episode
    - goal_success_rate
    - goal_events_per_episode
    - episode_return
    - native_cost
    - lagrange_multiplier

condition_cost_budgets:
  task_only:
    environment_id: Stage1SafetyPointGoal1TaskOnly-v0
    algorithm: PPOLag
    lagrange_cost_limit: 0.0
    semantic_unit: selected learner cost is identically zero
  native_cost:
    environment_id: Stage1SafetyPointGoal1NativeCost-v0
    algorithm: PPOLag
    lagrange_cost_limit: 25.0
    semantic_unit: expected native hazard-cost steps per 1000-step episode
  gold_stl_cost:
    environment_id: Stage1SafetyPointGoal1STLCost-v0
    algorithm: PPOLag
    lagrange_cost_limit: 0.1
    semantic_unit: expected missed bounded-recovery obligations per 1000-step episode

matched_training_candidate:
  total_transitions: 1000000
  steps_per_epoch: 10000
  vector_env_nums: 10
  per_vector_steps_per_epoch: 1000
  complete_episode_horizons_per_epoch: 1
  episode_horizon: 1000
  update_iters: 40
  batch_size: 64
  observation_normalization: true
  reward_normalization: false
  cost_normalization: false
  actor_hidden_sizes: [64, 64]
  critic_hidden_sizes: [64, 64]
  budget_interpretation: pilot_only_not_evidence_of_convergence
  require_learning_curve_review_before_convergence_claim: true

pre_main_gates:
  - O6_is_confirmed_for_pilot_in_DECISIONS_D31
  - three_condition_small_budget_sanity_passes
  - all_automated_tests_pass
  - on_policy_positive_stl_cost_sanity_passes
  - all_condition_configs_declare_lagrange_cost_limit
  - per_vector_rollout_length_is_multiple_of_full_episode_horizon
  - checkpoint_evaluator_has_zero_online_oracle_event_and_cost_mismatches
  - rtamt_completed_window_robustness_difference_at_most_1e-9

interpretation_guards:
  - native_and_stl_cost_limits_have_different_semantic_units
  - stl_cost_limit_0p1_is_events_per_episode_not_automatically_a_10_percent_rate
  - fixed_final_checkpoints_use_the_same_deterministic_policy_mode
  - full_1M_runs_do_not_start_automatically_after_sanity
  - equal_numeric_limits_are_not_assumed_fair
  - trigger_free_episodes_do_not_count_as_recovery_evidence
  - terminal_unresolved_is_reported_separately_even_when_included_in_training_cost
  - no_formal_safety_guarantee_is_claimed
  - no_stage_II_language_component_is_enabled
