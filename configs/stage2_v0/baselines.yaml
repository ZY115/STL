schema_version: 2
status: d37_design_frozen_implementation_pending
authority: D37
work_order: docs/STAGE2_CONTINUOUS_WORK_ORDER.md
benchmark_id: safety_stl_controlled_language_v0

common_contract:
  environment: SafetyPointGoal1-v0
  language_inputs: same controlled-language record and frozen split
  public_signals:
    - nearest_hazard_center_distance_public
  causal_only: true
  future_trajectory_access: prohibited
  test_gold_label_access: prohibited_until_independent_human_review
  paid_api_access: prohibited
  final_truth: human-reviewed Gold STL evaluated by the verified oracle
  report_separately:
    - annotation_count
    - supervision_type
    - pretrained_resources_and_revisions
    - model_parameter_count
    - training_compute
    - inference_compute
    - API_use_and_cost

benchmark_design:
  canonical_specification_count: 40
  paraphrases_per_specification: 2
  formula_families:
    hysteretic_bounded_recovery: 8
    recovery_plus_persistence: 8
    bounded_avoidance: 8
    conjunction: 8
    disjunction: 8
  split:
    train: 20
    validation: 8
    parameter_test: 4
    structure_test_disjunction: 8
  independent_human_review_required: true

methods:
  formal_path:
    method_id: formal_t5_structured_stl_v0
    role: primary_formal_method
    implementation_classification: project_adaptation_motivated_by_nl2tl
    pretrained_model: google-t5/t5-base
    output: typed_json_ast_then_deterministic_stl_compilation
    model_seeds: 3
    input:
      language: controlled_natural_language
      signal_registry: public_typed_grounding_registry
      trajectory_history: none_during_translation
    supervision: gold_formula_and_typed_grounding_on_training_split_only
    prohibited:
      - held_out_gold_stl
      - held_out_gold_labels
      - silent_test_output_repair
      - paid_api

  grammar_sanity:
    method_id: deterministic_controlled_grammar_parser_v0
    role: non_neural_engineering_sanity_not_primary_method

  published_direct_current_observation:
    method_id: lou_style_minilm_current_observation_v0
    role: published_style_structural_ablation_not_sole_primary_opponent
    implementation_classification: idea_level_adaptation
    pretrained_model: sentence-transformers/all-MiniLM-L12-v2
    classifier: documented_cosine_or_mlp_binary_classifier
    model_seeds: 3
    input:
      language: controlled_natural_language
      trajectory_history: current_public_observation_only
    output: binary_violation_event_probability
    supervision: gold_trace_labels_on_training_split_only
    prohibited:
      - gold_stl
      - gold_monitor_state
      - future_trajectory
      - test_gold_labels
      - paid_api

  history_aware_direct:
    method_id: minilm_gru_causal_history_v0
    role: primary_direct_opponent
    implementation_classification: project_adaptation
    language_model: sentence-transformers/all-MiniLM-L12-v2
    temporal_model: GRU
    hidden_size: 128
    maximum_context_steps: 128
    fusion_head: two_layer_mlp
    model_seeds: 3
    output:
      - violation_event_probability
      - active_obligation_probability
      - auxiliary_remaining_fraction
    supervision: gold_trace_labels_on_training_split_only
    loss: class_weighted_binary_cross_entropy_from_training_prevalence
    prohibited:
      - gold_stl
      - gold_monitor_state
      - handcrafted_monitor_timer
      - future_trajectory
      - test_gold_labels
      - paid_api

offline_admission_gate:
  minimum_positive_held_out_events: 100
  output_schema_validity: 1.0
  violation_event_recall_min: 0.95
  violation_event_precision_min: 0.90
  f1_min: 0.92
  false_negative_rate_max: 0.05
  event_time_mae_steps_max: 2.0
  deadline_equality_boundary_accuracy_min: 0.95
  terminal_unresolved_accuracy_min: 0.90
  minimal_pair_accuracy_min: 0.90
  paraphrase_consistency_min: 0.95
  report_uncertainty: 95_percent_wilson_or_bootstrap
  primary_methods_required_to_pass:
    - formal_path
    - history_aware_direct

remaining_external_gate:
  - independent_human_review_and_adjudication_of_all_held_out_gold_records

software_environment:
  conda_environment: stl-stage2-offline
  python: 3.8.20
  torch: 2.4.1+cu124
  transformers: 4.46.3
  sentence_transformers: 3.2.1
  sentencepiece: 0.2.0
  typeguard: 4.4.0
  pytest: 8.3.5
  note: separate clone of the verified Stage I CUDA environment; Stage I is not modified

training_protocol:
  status: frozen_initial_train_validation_protocol_before_any_held_out_evaluation
  model_seeds: [6101, 6202, 6303]
  device: cuda:0
  mixed_precision: false
  deterministic_algorithms: true
  gradient_clip_norm: 1.0
  checkpoint_policy: resumable_latest_and_validation_best_only
  selection_data: validation_only
  formal_path:
    epochs: 5
    batch_size: 8
    gradient_accumulation_steps: 4
    learning_rate: 5.0e-5
    weight_decay: 0.01
    max_source_tokens: 256
    max_target_tokens: 512
    tokenizer_json_tokens: ["{", "}", ",", "[", "]"]
    selection_metric: typed_ast_exact_accuracy
  published_direct_current_observation:
    epochs: 10
    batch_size: 16
    encoder_learning_rate: 2.0e-5
    head_learning_rate: 3.0e-4
    weight_decay: 0.01
    decision_threshold: 0.5
    selection_metric: validation_event_f1
  history_aware_direct:
    epochs: 10
    batch_size: 16
    encoder_learning_rate: 2.0e-5
    head_learning_rate: 3.0e-4
    weight_decay: 0.01
    decision_threshold: 0.5
    active_loss_weight: 0.5
    remaining_loss_weight: 0.2
    selection_metric: validation_event_f1
