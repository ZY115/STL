schema_version: 1
protocol_id: stage1_gold_stl_pilot_v1
status: frozen_stage1_pilot_not_final_main_study_standard
approved_by_project_owner: true
approved_date: 2026-08-11
decision_record: DECISIONS.md#D31

primary_safety_metric:
  name: missed_recovery_obligations_per_triggered_recovery_obligation
  numerator:
    - deadline_violation
    - terminal_unresolved
  denominator: warning_trigger
  pooling: pool_event_counts_across_all_matched_evaluation_episodes
  primary_comparison: gold_stl_cost_vs_task_only
  absolute_reduction_definition: task_only_rate_minus_gold_stl_rate
  relative_reduction_definition: absolute_reduction_divided_by_task_only_rate
  target_relative_reduction: 0.30
  always_report_absolute_difference: true
  if_task_only_baseline_rate_is_zero: relative_reduction_is_undefined_use_absolute_difference

goal_success_noninferiority:
  metric: episode_goal_success
  definition: at_least_one_goal_met_event_within_the_1000_step_episode
  absolute_margin_percentage_points: 10
  comparison: gold_stl_cost_minus_task_only

matched_design:
  training_seeds: [1101, 2202, 3303, 4404, 5505]
  evaluation_seed_start: 10000
  evaluation_episodes_per_training_seed_and_condition: 100
  paired_evaluation_seeds_across_conditions: true
  checkpoint_selection: fixed_final_checkpoint
  policy_mode: deterministic
  evaluator: common_gold_stl_evaluator
  episode_horizon: 1000
  uncertainty:
    method: paired_hierarchical_percentile_bootstrap
    confidence_level: 0.95
    replicates: 10000
    resample_training_seeds: true
    resample_matched_evaluation_episodes_within_training_seed: true

condition_budget_contract:
  units_are_different: true
  equal_numbers_do_not_imply_equal_constraint_strength: true
  task_only:
    cost_limit: 0.0
    semantic_unit: selected_learner_cost_is_identically_zero
  native_cost:
    cost_limit: 25.0
    semantic_unit: native_hazard_cost_steps_per_1000_step_episode
  gold_stl_cost:
    cost_limit: 0.1
    semantic_unit: missed_recovery_obligation_events_per_1000_step_episode
    interpretation_guard: not_automatically_a_10_percent_violation_rate

pilot_budget:
  transitions_per_condition_and_training_seed: 1000000
  interpretation: pilot_budget_only_not_a_convergence_guarantee
  require_learning_curve_review_before_convergence_claim: true
  full_runs_require_small_budget_sanity_gate: true
  do_not_start_full_runs_automatically_after_sanity: true
  cuda_determinism_environment:
    CUBLAS_WORKSPACE_CONFIG: ":4096:8"

omnisafe:
  algorithm: PPOLag
  train_cfgs:
    device: cuda:0
    torch_threads: 2
    vector_env_nums: 10
    parallel: 1
    total_steps: 1000000
  algo_cfgs:
    steps_per_epoch: 10000
    update_iters: 40
    batch_size: 64
    target_kl: 0.02
    entropy_coef: 0.0
    reward_normalize: false
    cost_normalize: false
    obs_normalize: true
    kl_early_stop: true
    use_max_grad_norm: true
    max_grad_norm: 40.0
    use_critic_norm: true
    critic_norm_coef: 0.001
    gamma: 0.99
    cost_gamma: 0.99
    lam: 0.95
    lam_c: 0.95
    clip: 0.2
    adv_estimation_method: gae
    standardized_rew_adv: true
    standardized_cost_adv: true
    penalty_coef: 0.0
    use_cost: true
  logger_cfgs:
    use_wandb: false
    use_tensorboard: false
    save_model_freq: 10
    window_lens: 100
  model_cfgs:
    weight_initialization_mode: kaiming_uniform
    actor_type: gaussian_learning
    linear_lr_decay: true
    exploration_noise_anneal: false
    std_range: [0.5, 0.1]
    actor:
      hidden_sizes: [64, 64]
      activation: tanh
      lr: 0.0003
    critic:
      hidden_sizes: [64, 64]
      activation: tanh
      lr: 0.0003
  lagrange_cfgs_shared:
    lagrangian_multiplier_init: 0.001
    lambda_lr: 0.035
    lambda_optimizer: Adam
  env_cfgs:
    max_episode_steps: 1000

required_reporting:
  - raw_episode_records
  - per_training_seed_results
  - learning_curves
  - final_checkpoint_identity_and_hash
  - trigger_count_and_rate
  - deadline_violation_count_and_rate_per_trigger
  - terminal_unresolved_count_and_rate_per_trigger
  - missed_obligation_rate_per_trigger
  - missed_obligations_per_episode
  - absolute_and_relative_primary_differences
  - goal_success_rate
  - episode_return
  - goal_events_per_episode
  - native_cost
  - stl_cost
  - lagrange_multiplier

interpretation_guards:
  - this_is_not_the_final_main_study_standard
  - no_formal_safety_guarantee
  - no_best_checkpoint_selection_for_primary_comparison
  - no_stage_II_language_component
